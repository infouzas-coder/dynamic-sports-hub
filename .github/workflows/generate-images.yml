name: Generate site images
on:
  push:
    branches: [image-gen2]
    paths: ["scripts/gen/**", ".github/workflows/generate-images.yml"]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/gen/run.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "Generated site images" || echo "nothing to commit"
          git push
